<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Product Showcase</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Loading Animation -->
  <div class="loader-box">
    <div class="spinner"></div>
  </div>

  <nav class="navbar">
    <span class="logo">Qwali's Shop</span>
    <ul class="nav-links">
      <li><a href="#hero">Home</a></li>
      <li><a href="#products">Items</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>

  <!-- Hero Section with Animated Background -->
  <header id="hero" class="hero">
    <div class="skew-badge">SALE TODAY</div>
    <h1>Simple Device Store</h1>
    <p>Clean design with CSS animations and transforms.</p>
    <a href="#products" class="cta-btn">Shop Now</a>
  </header>

  <!-- Featured Product Cards (6 Cards) -->
  <main id="products" class="container">
    <h2>Featured Products</h2>

    <div class="grid">
      <div class="card card-1">
        <span class="icon">🎧</span>
        <h3>Headphones</h3>
        <p>R999</p>
        <button class="buy-btn">Buy</button>
      </div>

      <div class="card card-2">
        <span class="icon">⌚</span>
        <h3>Smart Watch</h3>
        <p>R1,300</p>
        <button class="buy-btn">Buy</button>
      </div>

      <div class="card card-3">
        <span class="icon">⌨️</span>
        <h3>Keyboard</h3>
        <p>R279</p>
        <button class="buy-btn">Buy</button>
      </div>

      <div class="card card-4">
        <span class="icon">🖱️</span>
        <h3>Wireless Mouse</h3>
        <p>R149</p>
        <button class="buy-btn">Buy</button>
      </div>

      <div class="card card-5">
        <span class="icon">📷</span>
        <h3>Camera</h3>
        <p>R2,999</p>
        <button class="buy-btn">Buy</button>
      </div>

      <div class="card card-6">
        <span class="icon">🔊</span>
        <h3>Speaker</h3>
        <p>R389</p>
        <button class="buy-btn">Buy</button>
      </div>
    </div>
  </main>

</body>
</html>
